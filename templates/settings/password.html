{% extends "base.html" %}

{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}

<div class="max-w-md">
    <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-6">
        <form method="POST">
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Current password</label>
                <input type="password" name="current_password" required
                       class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm
                              bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200
                              focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">New password</label>
                <input type="password" name="new_password" required minlength="6"
                       class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm
                              bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200
                              focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                <p class="text-xs text-slate-400 dark:text-slate-500 mt-1">At least 6 characters.</p>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Confirm new password</label>
                <input type="password" name="confirm_password" required minlength="6"
                       class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm
                              bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200
                              focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            </div>

            <button type="submit"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition">
                Update Password
            </button>
        </form>
    </div>
</div>

{% endblock %}
